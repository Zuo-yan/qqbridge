[plugin]
name = "multi_platform_parser"
config_version = "1.0.0"
version = "1.0.2"
enabled = true

[parser]
enabled_platforms = ["douyin", "xhs", "xiaoheihe"]
group_whitelist = []
block_ai_reply = false
debounce_seconds = 120
max_images = 9
max_text_chars = 700
send_images = true
send_video = true
use_forward_for_multi = true
source_max_size_mb = 80
source_max_minutes = 8

[network]
proxy = ""
use_proxy_platforms = []
common_timeout = 30
download_timeout = 120
download_retry_times = 1

[cookies]
douyin = ""
xhs = ""
xiaoheihe = ""
bilibili = ""

[api]
host = "127.0.0.1"
port = 3000
token = ""
bot_uin = ""
