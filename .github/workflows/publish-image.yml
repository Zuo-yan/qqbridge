name: Publish MaiBot image

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify release version and package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          test "$RELEASE_TAG" = "v$(cat VERSION)"
          python -I tools/release.py --root .
          python -I tests/test_shared.py
          python -I tests/test_deployment.py
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish versioned image
        uses: docker/build-push-action@v6
        with:
          context: ./image
          platforms: linux/amd64
          push: true
          tags: ghcr.io/zuo-yan/qqbridge-maibot:${{ github.event.release.tag_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
