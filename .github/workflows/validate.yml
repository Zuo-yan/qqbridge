name: Validate deployment package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell 5.1 regression checks
        shell: powershell
        run: .\tests\windows.ps1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Package syntax, encoding, credentials and integrity
        run: python -I tools/release.py --root .
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Isolated deployment and recovery regressions
        run: |
          python -I tests/test_shared.py
          python -I tests/test_deployment.py
      - name: Package validation
        run: python -I tools/release.py --root .
      - name: Compose validation with example values only
        run: docker compose --env-file .env.example -f compose.yaml config --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Build image and verify proxy dependencies
        uses: docker/build-push-action@v6
        with:
          context: ./image
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
